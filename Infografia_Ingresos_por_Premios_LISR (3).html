<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Ingresos por la Obtención de Premios — LISR</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dce3ed;--accent:#2563eb;--accent2:#eaf1ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1080px;margin:auto;padding:28px 18px 50px}.hero{background:linear-gradient(135deg,#15284b,#2563eb);color:#fff;border-radius:26px;padding:28px;display:grid;grid-template-columns:1.25fr .75fr;gap:25px;align-items:center}.kicker{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.85}.hero h1{font-size:clamp(30px,5vw,50px);line-height:1.02;margin:8px 0 10px}.hero p{line-height:1.55;margin:5px 0;color:#eaf1ff}.name{font-weight:800;color:#fff!important}.hero img{width:100%;height:230px;object-fit:cover;border-radius:18px;background:#fff}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 14px;border-radius:12px;font-weight:800;cursor:pointer}.tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff}.panel{background:var(--card);border:1px solid var(--line);border-radius:21px;padding:24px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h2{margin:0;font-size:28px}.badge{font-size:12px;font-weight:800;color:var(--muted);border:1px solid var(--line);padding:7px 10px;border-radius:999px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}.card{background:#f8fafc;border:1px solid var(--line);border-radius:17px;padding:18px}.card h3{margin:0 0 8px;font-size:17px}.card p,.card li{font-size:14px;line-height:1.6;color:var(--muted)}.card ul{padding-left:20px;margin-bottom:0}.pic{padding:0;overflow:hidden}.pic img{width:100%;height:205px;object-fit:cover;display:block}.pic .caption{padding:15px}.calc{margin-top:18px;background:var(--accent2);border:1px solid #cbdcff;border-radius:18px;padding:22px;text-align:center}.calc .label{font-size:12px;font-weight:900;color:var(--muted);letter-spacing:.08em}.calc .big{font-size:clamp(28px,5vw,42px);font-weight:900;margin:8px 0}.calc .sub{font-size:13px;color:var(--muted);line-height:1.5}.flow{display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:18px}.step{flex:1;min-width:145px;text-align:center;border:1px solid var(--line);background:#f8fafc;border-radius:15px;padding:15px}.step strong{font-size:20px}.arrow{font-size:22px;color:var(--muted)}.net{background:#eefbf3;border:1px solid #bfe7ce;border-radius:17px;padding:20px;text-align:center;margin-top:16px}.net .amount{font-size:38px;font-weight:900;margin-top:5px}.note{margin-top:16px;padding:14px 16px;border-left:4px solid var(--accent);background:#f8fafc;border-radius:8px;color:var(--muted);font-size:14px;line-height:1.55}.law{display:flex;gap:14px;border:1px solid var(--line);background:#f8fafc;border-radius:14px;padding:14px;margin-top:9px}.law strong{min-width:78px}.law span{color:var(--muted);font-size:14px;line-height:1.5}.quiz{margin-top:18px}.quiz button.choice{display:block;width:100%;text-align:left;margin:8px 0;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;cursor:pointer;font-weight:700}.quiz button.choice:hover{border-color:var(--accent)}#quizResult{margin-top:12px;font-weight:800;line-height:1.5}@media(max-width:760px){.hero{grid-template-columns:1fr}.grid,.grid2{grid-template-columns:1fr}.arrow{display:none}}
</style></head><body><div class="wrap">
<section class="hero"><div><div class="kicker">Ley del Impuesto sobre la Renta · Título IV · Capítulo VII</div><h1>Ingresos por la Obtención de Premios</h1><p><strong>Personas físicas · Artículos 137 al 139</strong></p><p class="name">Hugo Emilio Caceres Canepa</p><p>premios, retención del ISR federal y el impuesto estatal aplicable en Campeche.</p></div><img src="https://media.easy-peasy.ai/65ecbd1f-df69-48ff-95d0-716ce9c3adef/1640047a-4b20-48cd-b86e-93a82e6f8c15_thumb.webp" alt="Persona celebrando un premio de lotería"></section>
<nav class="tabs"><button class="active" data-tab="concepto">¿Qué son?</button><button data-tab="caso">Caso de RUBEN ZENDEJAS</button><button data-tab="impuestos">Impuestos</button><button data-tab="retencion">Retención</button><button data-tab="obligaciones">Obligaciones</button><button data-tab="resumen">Resumen</button><button data-tab="fundamento">Fundamento legal</button></nav><section class="panel" id="content"></section></div>
<script>
const tabs={
concepto:{title:'¿Qué se considera ingreso por premios?',badge:'Art. 137 LISR',html:`<div class="grid"><div class="card"><h3>🎟️ Loterías y rifas</h3><p>Son ingresos por premios los que derivan de loterías, rifas, sorteos, juegos con apuestas y concursos de toda clase, siempre que estén autorizados legalmente.</p></div><div class="card"><h3>💰 Impuesto pagado por el otorgante</h3><p>Si quien entrega el premio paga por cuenta del ganador el impuesto que corresponde como retención, ese importe se considera ingreso comprendido en este Capítulo.</p></div><div class="card"><h3>📌 Importante</h3><p>El reintegro correspondiente al billete que permitió participar en una lotería no se considera premio.</p></div></div><div class="note"><strong>Idea clave:</strong> la LISR establece un tratamiento específico para los premios obtenidos mediante loterías, rifas, sorteos, juegos con apuestas y concursos.</div>`},
caso:{title:'Caso hipotético: RUBEN ZENDEJAS gana un premio',badge:'Caso práctico',html:`<div class="grid"><div class="card"><h3>🏆 Premio obtenido</h3><p>RUBEN ZENDEJAS, persona física residente en México, gana un premio en un sorteo legal organizado en territorio nacional por:</p><strong style="font-size:32px">$100,000</strong></div></div><div class="calc"><div class="label">IMPUESTO FEDERAL ISR</div><div class="big">$100,000 × 1% = $1,000</div><div class="sub">La tasa federal aplicable es 1% cuando el impuesto local de la entidad no excede 6%.</div></div><div class="calc"><div class="label">IMPUESTO ESTATAL · CAMPECHE</div><div class="big">$100,000 × 6% = $6,000</div><div class="sub">Para el supuesto señalado, Campeche establece 6% sobre el valor del premio.</div></div><div class="net"><div>Premio bruto − impuesto federal − impuesto estatal</div><div class="amount">$93,000 netos</div></div><div class="note"><strong>Resultado:</strong> se retendrían $7,000 en total: $1,000 federal y $6,000 estatal.</div>`},
impuestos:{title:'¿Cuánto se paga de impuestos?',badge:'Federal + estatal',html:`<div class="grid2"><div class="card"><h3>🇲🇽 ISR federal</h3><p>Para loterías, rifas, sorteos y concursos organizados en territorio nacional, el artículo 138 establece una tasa de <strong>1%</strong> cuando la entidad federativa no grava estos ingresos o su impuesto local no excede del 6%.</p><p>Si el impuesto local excede 6%, la tasa federal prevista por ese artículo es 21%.</p></div><div class="card"><h3>🏛️ Impuesto estatal</h3><p>La tasa depende de la legislación de cada entidad federativa.</p><p>En <strong>Campeche</strong>, para los premios señalados por su Ley de Hacienda, la tasa es de <strong>6%</strong> sobre el valor del premio y el impuesto es retenido por el organizador.</p></div></div><div class="flow"><div class="step"><strong>1%</strong><br>Federal</div><div class="arrow">+</div><div class="step"><strong>6%</strong><br>Campeche</div><div class="arrow">=</div><div class="step"><strong>7%</strong><br>Total del ejemplo</div></div><div class="note"><strong>Nota:</strong> el cálculo estatal puede variar según la entidad federativa y el tipo de premio. Este ejemplo está construido para Campeche.</div>`},
retencion:{title:'¿Quién retiene y qué sucede con el ISR?',badge:'Art. 138 LISR',html:`<div class="grid"><div class="card pic"><img src="https://tse1.mm.bing.net/th?c=5&h=720&p=0&q=lottery+tax+calculator+2023&rs=1&w=1280" alt="Ejemplo visual de cálculo de impuestos"><div class="caption"><strong>Retención</strong><p>El impuesto correspondiente se retiene al momento del pago del premio.</p></div></div><div class="card"><h3>🧾 El organizador</h3><p>Quien realiza el pago del premio efectúa la retención del impuesto federal y, cuando corresponda, el impuesto estatal.</p></div><div class="card"><h3>📌 Pago definitivo</h3><p>El impuesto del artículo 138 puede considerarse pago definitivo cuando quien percibe el ingreso lo declara estando obligado a ello conforme al segundo párrafo del artículo 90.</p></div></div><div class="note"><strong>Si no se realiza la declaración prevista:</strong> la retención no puede considerarse pago definitivo y la persona debe acumular el ingreso a sus demás ingresos, pudiendo acreditar la retención federal contra el impuesto anual.</div>`},
obligaciones:{title:'Obligaciones relacionadas con los premios',badge:'Arts. 90 y 139',html:`<div class="grid"><div class="card"><h3>1️⃣ Informar premios superiores a $600,000</h3><p>Las personas físicas residentes en México deben informar en la declaración del ejercicio los préstamos, donativos y premios obtenidos cuando, individualmente o en conjunto, excedan de <strong>$600,000</strong>.</p></div><div class="card"><h3>2️⃣ Comprobante fiscal</h3><p>Quien entregue el premio debe proporcionar comprobante fiscal con el monto de la operación y el impuesto retenido que fue enterado, conforme al artículo 139.</p></div><div class="card pic"><img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Tax_calculator.jpg" alt="Documentación y cálculo fiscal"><div class="caption"><strong>3️⃣ Constancias y documentación</strong><p>El pagador debe conservar la documentación relacionada con constancias, comprobantes fiscales y retenciones.</p></div></div></div><div class="note"><strong>Para RUBEN ZENDEJAS:</strong> el premio hipotético de $100,000, por sí solo, no supera el umbral de $600,000 del artículo 90.</div>`},
resumen:{title:'Resumen: del premio al dinero neto',badge:'Caso de RUBEN ZENDEJAS',html:`<div class="flow"><div class="step"><strong>$100,000</strong><br>Premio bruto</div><div class="arrow">→</div><div class="step"><strong>$1,000</strong><br>ISR federal 1%</div><div class="arrow">+</div><div class="step"><strong>$6,000</strong><br>Estatal 6%</div><div class="arrow">→</div><div class="step"><strong>$93,000</strong><br>Premio neto</div></div><div class="grid2"><div class="card"><h3>🔎 ¿Por qué 7%?</h3><p>Campeche aplica 6% al premio en el supuesto señalado y, al no exceder ese porcentaje, la LISR conserva la tasa federal de 1% para el cálculo del artículo 138.</p></div><div class="card"><h3>📄 ¿Quién retiene?</h3><p>El organizador o quien efectúe el pago realiza las retenciones correspondientes y entrega la documentación fiscal que proceda.</p></div></div><div class="net"><div>Resultado del caso hipotético</div><div class="amount">$93,000</div><div>monto neto después de retenciones</div></div>`},
fundamento:{title:'Fundamento legal',badge:'LISR + Campeche',html:`<div class="law"><strong>Art. 90</strong><span>Obligación de informar determinados premios, préstamos y donativos cuando excedan $600,000 individualmente o en conjunto.</span></div><div class="law"><strong>Art. 137</strong><span>Define los ingresos por la obtención de premios y establece qué conceptos quedan comprendidos.</span></div><div class="law"><strong>Art. 138</strong><span>Establece las tasas del impuesto federal y las reglas de retención para premios.</span></div><div class="law"><strong>Art. 139</strong><span>Establece obligaciones de quienes entregan los premios, como comprobantes y conservación de documentación.</span></div><div class="law"><strong>Campeche</strong><span>La Ley de Hacienda del Estado establece una tasa de 6% para los premios señalados en el supuesto del ejemplo.</span></div><div class="note"><strong>Fuentes jurídicas:</strong> Ley del Impuesto sobre la Renta y Ley de Hacienda del Estado de Campeche. El caso es académico e hipotético.</div>`}
};
const content=document.getElementById('content');function render(key){const s=tabs[key];content.innerHTML='<div class="head"><h2>'+s.title+'</h2><span class="badge">'+s.badge+'</span></div>'+s.html;if(key==='quiz'){content.querySelectorAll('.choice').forEach(btn=>btn.addEventListener('click',()=>{const r=content.querySelector('#quizResult');r.textContent=btn.dataset.answer==='correct'?'✓ Correcto. $100,000 − $1,000 − $6,000 = $93,000.':'✗ Revisa: 1% federal + 6% estatal = 7%; el neto es $93,000.';}));}}document.querySelectorAll('[data-tab]').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render(btn.dataset.tab)}));render('concepto');
</script></body></html>
